[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "failure-corpus"
version = "0.1.1"
description = "Turn noisy test and agent logs into a deduplicated failure corpus that can feed regression and eval suites."
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "yashkhou"}]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
